<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7e7eb">
<title>reset</title>

<style>
*{box-sizing:border-box}
:root{
  --pink:#f4dce3;
  --pink2:#f9edf0;
  --rose:#b86d7d;
  --burg:#702f3d;
  --beige:#eee4d6;
  --cream:#faf7f3;
  --black:#171516;
  --gray:#858080;
  --white:#fff;
  --radius:24px;
}
body{
  margin:0;
  background:linear-gradient(160deg,#fff,#f9eef1 55%,#eee4d6);
  color:var(--black);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:90px}
.hidden{display:none!important}

.splash{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#fff,#f4dce3);
  animation:fadeOut 1s ease 2.4s forwards;
}
.splash-logo{
  font-size:64px;
  letter-spacing:10px;
  font-weight:800;
  animation:logoIn 1.4s ease;
}
@keyframes logoIn{
  from{opacity:0;transform:translateY(20px) scale(.92)}
  to{opacity:1;transform:none}
}
@keyframes fadeOut{
  to{opacity:0;visibility:hidden;pointer-events:none}
}

.onboarding{
  min-height:100vh;
  padding:55px 24px;
  display:flex;
  align-items:center;
}
.ob-card{
  width:100%;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.8);
  border-radius:32px;
  padding:30px;
  box-shadow:0 20px 60px rgba(112,47,61,.12);
}
.logo{font-size:34px;font-weight:800;letter-spacing:6px}
.ob-title{font-size:29px;line-height:1.15;margin:22px 0 12px}
.ob-text{color:#686264;line-height:1.55}
.btn{
  border:0;
  border-radius:18px;
  padding:15px 19px;
  background:var(--black);
  color:white;
  width:100%;
  margin-top:18px;
}
.btn.pink{background:var(--burg)}
.btn.light{background:var(--pink2);color:var(--black)}
.field{margin-top:16px}
.field label{display:block;font-size:13px;color:var(--gray);margin-bottom:7px}
.field input,.field textarea,.field select{
  width:100%;
  border:1px solid #eadde0;
  background:#fff;
  border-radius:16px;
  padding:14px;
  outline:none;
}
textarea{min-height:100px;resize:vertical}
.goal-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:15px;
}
.goal{
  padding:13px;
  border:1px solid #eadde0;
  background:white;
  border-radius:15px;
  text-align:left;
}
.goal.active{background:var(--pink);border-color:var(--rose)}

header{
  padding:24px 20px 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header-logo{font-weight:800;letter-spacing:5px}
.avatar{
  width:42px;height:42px;border-radius:50%;
  background:var(--burg);color:white;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;
}
.page{padding:10px 18px}
.greeting{font-size:29px;font-weight:700}
.sub{color:var(--gray);margin-top:5px}
.weather{
  margin-top:18px;
  background:linear-gradient(135deg,#fff,#f8e7eb);
  border-radius:26px;padding:20px;
}
.weather-top{display:flex;justify-content:space-between}
.temp{font-size:42px;font-weight:700}
.weather-city{font-weight:600}
.card{
  background:rgba(255,255,255,.78);
  border:1px solid rgba(255,255,255,.8);
  border-radius:24px;
  padding:18px;
  margin-top:14px;
  box-shadow:0 10px 35px rgba(70,40,50,.06);
}
.card-title{font-weight:700;font-size:18px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.small{font-size:13px;color:var(--gray)}
.stat{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}
.stat>div{
  background:#faf5f2;
  border-radius:17px;
  padding:14px 8px;
  text-align:center;
}
.stat b{display:block;font-size:22px}
.nav{
  position:fixed;
  z-index:20;
  bottom:0;
  left:0;
  right:0;
  margin:auto;
  max-width:720px;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(20px);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  border-top:1px solid #eee;
}
.nav button{
  border:0;background:none;color:#777;padding:8px 2px;font-size:11px;
}
.nav button.active{color:var(--burg);font-weight:700}
.icon{font-size:20px;display:block;margin-bottom:3px}
.task{
  display:flex;gap:12px;align-items:flex-start;
  padding:13px 0;border-bottom:1px solid #eee;
}
.check{
  width:25px;height:25px;border-radius:9px;
  border:1px solid #cbb9bd;
  background:white;flex:none;
}
.check.done{background:var(--burg);border-color:var(--burg)}
.check.done:after{content:"✓";color:#fff;display:block;text-align:center}
.fire{
  font-size:25px;
}
.progress{
  height:9px;background:#eee2e5;border-radius:20px;overflow:hidden;margin-top:12px;
}
.progress i{display:block;height:100%;background:var(--burg);border-radius:20px}
.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}
.tabs button{
  white-space:nowrap;border:0;border-radius:14px;
  background:#eee8e5;padding:10px 13px;
}
.tabs button.active{background:var(--burg);color:white}
.list-item{
  padding:14px 0;border-bottom:1px solid #eee;
}
.mood-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.mood{
  border:1px solid #eee;background:#fff;border-radius:16px;padding:11px 2px;
}
.mood.active{background:var(--pink);border-color:var(--rose)}
.calendar{
  display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px;
}
.day{
  min-height:44px;border:0;background:#faf7f3;border-radius:11px;
}
.day.today{background:var(--burg);color:#fff}
.foodrow,.moneyrow{
  display:flex;gap:7px;margin-top:8px;
}
.foodrow input,.moneyrow input{min-width:0}
.delete{
  border:0;background:#f3e8e8;color:#8b4c58;border-radius:10px;
}
.feature-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.feature{
  min-height:110px;text-align:left;border:0;border-radius:22px;
  padding:17px;background:#fff;
}
.feature strong{display:block;font-size:17px;margin-bottom:7px}
.timer{
  text-align:center;font-size:52px;font-weight:700;padding:25px 0;
}
.post{
  overflow:hidden;border-radius:22px;background:#fff;margin-top:15px;
}
.post img{width:100%;display:block;max-height:500px;object-fit:cover}
.post-body{padding:14px}
.modal{
  position:fixed;inset:0;background:rgba(20,15,17,.35);
  z-index:100;display:flex;align-items:flex-end;justify-content:center;
}
.modal-inner{
  width:min(720px,100%);
  max-height:90vh;overflow:auto;
  background:#fff;border-radius:30px 30px 0 0;padding:22px;
}
.close{float:right;border:0;background:#f3eeee;border-radius:50%;width:35px;height:35px}
.chat{
  height:430px;overflow:auto;background:#faf7f5;border-radius:20px;padding:12px;
}
.msg{
  max-width:85%;padding:11px 14px;border-radius:17px;margin:7px 0;
}
.msg.user{margin-left:auto;background:var(--burg);color:#fff}
.msg.ai{background:#fff}
.chatbar{display:flex;gap:7px;margin-top:8px}
.chatbar input{flex:1}
.empty{padding:25px;text-align:center;color:#888}
</style>
</head>

<body>

<div class="splash">
  <div class="splash-logo">reset</div>
</div>

<div id="app"></div>

<script>
"use strict";

/* =========================
   RESET — ONE FILE VERSION
   ========================= */

const KEY="reset_app_v1";

let db=JSON.parse(localStorage.getItem(KEY)||"null");

if(!db){
  db={
    registered:false,
    user:{
      nickname:"",
      city:"",
      country:"",
      goals:[]
    },
    streak:0,
    lastTaskDate:"",
    tasks:[],
    completedTasks:[],
    calories:[],
    money:[],
    diary:[],
    moods:[],
    planner:[],
    sleep:[],
    school:{
      subjects:[],
      sessions:[],
      notes:""
    },
    favourites:[],
    posts:[],
    profile:{
      bio:"",
      avatar:""
    },
    settings:{
      diaryPin:""
    }
  };
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(db));
}

function esc(s){
  return String(s??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function today(){
  return new Date().toISOString().slice(0,10);
}

function timeNow(){
  return new Date().toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function greeting(){
  const h=new Date().getHours();
  if(h>=5&&h<12)return "доброе утро";
  if(h>=12&&h<18)return "добрый день";
  if(h>=18&&h<24)return "добрый вечер";
  return "ты чего не спишь?";
}

function navigate(page){
  location.hash=page;
  render();
  window.scrollTo(0,0);
}

function modal(html){
  document.body.insertAdjacentHTML("beforeend",
    `<div class="modal" id="modal">
      <div class="modal-inner">
        <button class="close" onclick="closeModal()">×</button>
        ${html}
      </div>
    </div>`
  );
}

function closeModal(){
  document.getElementById("modal")?.remove();
}

/* =========================
   ONBOARDING
   ========================= */

let obStep=0;
let ob={
  nickname:"",
  city:"",
  country:"",
  goals:[]
};

const goals=[
  "улучшить оценки",
  "уменьшить время за телефоном",
  "улучшить сон",
  "заняться спортом",
  "улучшить питание",
  "научиться экономить",
  "улучшить английский",
  "найти новых друзей",
  "стать продуктивнее",
  "ухаживать за собой",
  "меньше откладывать дела",
  "свой вариант"
];

function onboarding(){
  const a=document.getElementById("app");

  if(obStep===0){
    a.innerHTML=`
      <div class="onboarding">
        <div class="ob-card">
          <div class="logo">reset</div>
          <div class="ob-title">
            подростки слишком много времени проводят в телефонах..
            мы поможем это исправить.
          </div>
          <div class="ob-text">
            reset помогает организовать учёбу, сон, спорт, финансы,
            питание, привычки и свободное время в одном месте.
          </div>
          <button class="btn pink" onclick="obStep=1;onboarding()">начать</button>
        </div>
      </div>`;
    return;
  }

  if(obStep===1){
    a.innerHTML=`
      <div class="onboarding">
       <div class="ob-card">
        <div class="small">1 / 3</div>
        <div class="ob-title">как тебя называть?</div>
        <div class="ob-text">можно настоящее имя, а можно придуманный никнейм.</div>
        <div class="field">
          <input id="obNick" placeholder="например, gabi" value="${esc(ob.nickname)}">
        </div>
        <button class="btn pink" onclick="nextNick()">продолжить</button>
       </div>
      </div>`;
    return;
  }

  if(obStep===2){
    a.innerHTML=`
      <div class="onboarding">
       <div class="ob-card">
        <div class="small">2 / 3</div>
        <div class="ob-title">где ты живёшь?</div>
        <div class="ob-text">
          укажи настоящий город и страну. это нужно не для публикации
          адреса, а для времени, погоды и некоторых рекомендаций.
        </div>
        <div class="field">
          <input id="obCity" placeholder="город" value="${esc(ob.city)}">
        </div>
        <div class="field">
          <input id="obCountry" placeholder="страна" value="${esc(ob.country)}">
        </div>
        <button class="btn pink" onclick="nextPlace()">продолжить</button>
       </div>
      </div>`;
    return;
  }

  a.innerHTML=`
    <div class="onboarding">
     <div class="ob-card">
      <div class="small">3 / 3</div>
      <div class="ob-title">что ты хочешь изменить?</div>
      <div class="ob-text">можно выбрать сколько угодно целей и добавить свою.</div>
      <div class="goal-grid">
       ${goals.map((g,i)=>`
        <button class="goal ${ob.goals.includes(g)?"active":""}"
          onclick="toggleObGoal(${i})">${esc(g)}</button>
       `).join("")}
      </div>
      <button class="btn pink" onclick="finishOnboarding()">войти в reset</button>
     </div>
    </div>`;
}

function nextNick(){
  const v=document.getElementById("obNick").value.trim();
  if(!v)return alert("введи никнейм");
  ob.nickname=v;
  obStep=2;
  onboarding();
}

function nextPlace(){
  const city=document.getElementById("obCity").value.trim();
  const country=document.getElementById("obCountry").value.trim();
  if(!city||!country)return alert("нужно указать город и страну");
  ob.city=city;
  ob.country=country;
  obStep=3;
  onboarding();
}

function toggleObGoal(i){
  const g=goals[i];
  if(g==="свой вариант"){
    const x=prompt("напиши свою цель");
    if(x?.trim())ob.goals.push(x.trim());
  }else{
    if(ob.goals.includes(g))
      ob.goals=ob.goals.filter(x=>x!==g);
    else ob.goals.push(g);
  }
  onboarding();
}

function finishOnboarding(){
  if(!ob.goals.length)return alert("выбери хотя бы одну цель");

  db.registered=true;
  db.user={
    nickname:ob.nickname,
    city:ob.city,
    country:ob.country,
    goals:ob.goals
  };

  generateTasks();
  save();
  navigate("home");
}

/* =========================
   TASKS
   ========================= */

function generateTasks(){
  const base=db.user.goals||[];
  const map={
    "улучшить оценки":"25 минут уделить самому сложному предмету",
    "уменьшить время за телефоном":"отложить телефон на 30 минут и заняться чем-нибудь офлайн",
    "улучшить сон":"сегодня лечь спать на 20 минут раньше обычного",
    "заняться спортом":"сделать 15 минут лёгкой физической активности",
    "улучшить питание":"добавить сегодня овощи или фрукты к одному приёму пищи",
    "научиться экономить":"записать все сегодняшние расходы",
    "улучшить английский":"выучить 5 новых английских слов",
    "найти новых друзей":"написать или поговорить сегодня с кем-нибудь новым",
    "стать продуктивнее":"сделать одну задачу, которую давно откладываешь",
    "ухаживать за собой":"сделать свою вечернюю рутину ухода",
    "меньше откладывать дела":"потратить 10 минут на дело, которое постоянно откладываешь"
  };

  db.tasks=base.slice(0,3).map((g,i)=>({
    id:Date.now()+i,
    text:map[g]||`сделать небольшой шаг в направлении: ${g}`,
    goal:g
  }));

  db.completedTasks=[];
  save();
}

function checkNewDay(){
  const d=today();
  if(db.lastTaskDate!==d){
    if(db.lastTaskDate){
      const yesterday=new Date();
      yesterday.setDate(yesterday.getDate()-1);
      const y=yesterday.toISOString().slice(0,10);

      if(db.lastTaskDate===y && db.completedTasks.length>0)
        db.streak++;
      else if(db.completedTasks.length===0)
        db.streak=0;
    }

    db.lastTaskDate=d;
    generateTasks();
  }
}

/* =========================
   WEATHER
   ========================= */

async function weather(){
  const box=document.getElementById("weather");
  if(!box)return;

  box.innerHTML=`загружаем погоду..`;

  try{
    const q=encodeURIComponent(`${db.user.city}, ${db.user.country}`);
    const g=await fetch(
      `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(db.user.city)}&count=1&language=ru&format=json`
    ).then(r=>r.json());

    if(!g.results?.length)throw Error();

    const p=g.results[0];

    const w=await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto`
    ).then(r=>r.json());

    const temp=Math.round(w.current.temperature_2m);
    const max=Math.round(w.daily.temperature_2m_max[0]);
    const min=Math.round(w.daily.temperature_2m_min[0]);

    box.innerHTML=`
      <div class="weather-top">
       <div>
        <div class="weather-city">${esc(db.user.city)}</div>
        <div class="small">${esc(db.user.country)}</div>
       </div>
       <div class="temp">${temp}°</div>
      </div>
      <div class="small">сегодня ${min}° / ${max}° · ветер ${Math.round(w.current.wind_speed_10m)} км/ч</div>`;
  }catch{
    box.innerHTML=`не получилось получить погоду. проверь интернет и город.`;
  }
}

/* =========================
   HOME
   ========================= */

function home(){
  checkNewDay();

  return`
  <header>
    <div class="header-logo">reset</div>
    <button class="avatar" onclick="navigate('profile')">
      ${esc((db.user.nickname||"r")[0].toUpperCase())}
    </button>
  </header>

  <main class="page">
    <div class="greeting">${greeting()}, ${esc(db.user.nickname)}.</div>
    <div class="sub">${new Date().toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"})}</div>

    <div class="weather" id="weather">загружаем погоду..</div>

    <div class="card">
      <div class="row between">
        <div>
          <div class="card-title">твой огонёк</div>
          <div class="small">ты в reset уже ${db.streak} ${plural(db.streak,"день","дня","дней")}</div>
        </div>
        <div class="fire">${db.streak>0?"🔥":"○"}</div>
      </div>
    </div>

    <div class="card">
      <div class="row between">
        <div class="card-title">факт дня</div>
        <div class="small">${today()}</div>
      </div>
      <p id="fact"></p>
    </div>

    <div class="card">
      <div class="row between">
       <div class="card-title">3 задания на сегодня</div>
       <div class="small">${db.completedTasks.length}/3</div>
      </div>

      ${db.tasks.map(t=>{
        const done=db.completedTasks.includes(t.id);
        return`
        <div class="task">
          <button class="check ${done?"done":""}" onclick="completeTask(${t.id})"></button>
          <div>
            <div>${esc(t.text)}</div>
            <div class="small">${esc(t.goal)}</div>
          </div>
        </div>`;
      }).join("")}
    </div>

    <div class="card">
      <div class="card-title">ещё 3 задачи на сегодня</div>
      <div class="small">ты можешь добавить собственные задачи</div>
      <button class="btn light" onclick="addTask()">добавить задачу</button>
    </div>

    <div class="card">
      <div class="card-title">возможности reset</div>
      <div class="feature-grid">
        <button class="feature" onclick="navigate('health')"><strong>health</strong>питание и спорт</button>
        <button class="feature" onclick="navigate('finance')"><strong>finance</strong>траты и статистика</button>
        <button class="feature" onclick="navigate('diary')"><strong>diary</strong>дневник и настроение</button>
        <button class="feature" onclick="navigate('school')"><strong>school</strong>учёба и таймер</button>
        <button class="feature" onclick="navigate('sleep')"><strong>sleep</strong>сон и режим</button>
        <button class="feature" onclick="navigate('foryou')"><strong>for you</strong>книги, музыка, кино</button>
      </div>
    </div>
  </main>`;
}

const facts=[
"осьминоги имеют три сердца.",
"бананы — ботанически ягоды, а клубника — нет.",
"у акул скелет состоит преимущественно из хряща.",
"мёд при правильном хранении может сохраняться очень долго.",
"сердце синего кита может весить сотни килограммов.",
"на венере день длится дольше её года.",
"человеческий мозг использует примерно пятую часть энергии организма.",

function dailyFact(){
  const n=Math.floor(
    new Date().getTime()/86400000
  )%facts.length;
  return facts[n];
}

function plural(n,a,b,c){
  n=Math.abs(n)%100;
  if(n>=11&&n<=19)return c;
  switch(n%10){
    case 1:return a;
    case 2:case 3:case 4:return b;
    default:return c;
  }
}

function completeTask(id){
  if(!db.completedTasks.includes(id)){
    db.completedTasks.push(id);
    if(db.completedTasks.length===1 && db.lastTaskDate===today()){
      db.streak=Math.max(1,db.streak);
    }
    save();
  }
  render();
}

function addTask(){
  const text=prompt("какую задачу добавить?");
  if(!text?.trim())return;
  db.tasks.push({
    id:Date.now(),
    text:text.trim(),
    goal:"твоя задача"
  });
  save();
  render();
}
